# 静的コンテンツを GitHub Pages にデプロイするためのシンプルなワークフロー
name: Deploy static content to Pages

on:
  push:
    branches: ['react-todo']

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './pytohn-ex/package-lock.json' # サブフォルダのキャッシュを指定
          
      - name: Install dependencies
        run: npm ci
        working-directory: ./pytohn-ex # 👈️ サブフォルダに移動してインストール
        
      - name: Build
        run: npm run build
        working-directory: ./pytohn-ex # 👈️ サブフォルダに移動してビルド
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # サブフォルダ内の dist フォルダをアップロードするように変更
          path: './pytohn-ex/dist' 
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4